{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h3 class="mb-4">Daftar Akun Baru</h3>
        <form method="POST" autocomplete="off">
            <div class="mb-3">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Password</label>
                <div class="input-group">
                    <input type="password" name="password" id="passwordInput" class="form-control" required
                        minlength="4">
                    <button type="button" class="btn btn-outline-secondary"
                        onclick="togglePassword('passwordInput', this)">👁️</button>
                </div>
            </div>
            <div class="mb-3">
                <label>Pertanyaan Keamanan</label>
                <select name="pertanyaan_keamanan" class="form-select" required>
                    <option value="">-- Pilih pertanyaan --</option>
                    <option value="Nama hewan peliharaan pertama?">Nama hewan peliharaan pertama?</option>
                    <option value="Nama sekolah SD?">Nama sekolah SD?</option>
                    <option value="Kota kelahiran?">Kota kelahiran?</option>
                    <option value="Nama ibu kandung?">Nama ibu kandung?</option>
                    <option value="Makanan favorit?">Makanan favorit?</option>
                </select>
            </div>
            <div class="mb-3">
                <label>Jawaban Keamanan</label>
                <input type="text" name="jawaban_keamanan" class="form-control" required>
                <small class="text-muted">Ingat baik-baik jawaban ini untuk reset password nanti.</small>
            </div>
            <button type="submit" class="btn btn-success w-100">Daftar</button>
        </form>
        <p class="mt-3 text-center">Sudah punya akun? <a href="/login">Login di sini</a></p>
    </div>
</div>

<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            button.textContent = '🙈';
        } else {
            input.type = 'password';
            button.textContent = '👁️';
        }
    }
</script>
{% endblock %}
