{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-4 mb-5">
    <div class="col-md-6">
        <div class="card p-4 shadow-sm border-0">
            <h3 class="mb-4 fw-bold text-center">Daftar Akun Baru</h3>

            <form method="POST" autocomplete="off">
                <div class="mb-3">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Password</label>
                    <div class="input-group">
                        <input type="password" name="password" id="passwordInput" class="form-control" required
                            minlength="4">
                        <button type="button" class="btn btn-outline-secondary"
                            onclick="togglePassword('passwordInput', this)">👁️</button>
                    </div>
                </div>

                <hr class="my-4">

                <div class="mb-3">
                    <label>Pertanyaan Keamanan</label>
                    <select name="pertanyaan_keamanan" class="form-select" required>
                        <option value="">-- Pilih pertanyaan --</option>
                        <option value="Nama hewan peliharaan pertama?">Nama hewan peliharaan pertama?</option>
                        <option value="Nama sekolah SD?">Nama sekolah SD?</option>
                        <option value="Kota kelahiran?">Kota kelahiran?</option>
                        <option value="Nama ibu kandung?">Nama ibu kandung?</option>
                        <option value="Makanan favorit?">Makanan favorit?</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label>Jawaban Keamanan</label>
                    <input type="text" name="jawaban_keamanan" class="form-control" required>
                    <small class="text-muted">Ingat baik-baik jawaban ini untuk reset password nanti.</small>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Daftar Akun</button>
            </form>

            <p class="mt-4 text-center mb-0">Sudah punya akun? <a href="/login"
                    class="text-decoration-none fw-bold">Login di sini</a></p>
        </div>
    </div>
</div>

<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            button.textContent = '🙈';
        } else {
            input.type = 'password';
            button.textContent = '👁️';
        }
    }
</script>
{% endblock %}
