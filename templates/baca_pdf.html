{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <h4 class="fw-bold mb-1">{{ buku.judul }}</h4>
        <small class="text-muted">oleh {{ buku.penulis }}</small>
    </div>
    <div>
        <a href="/buku/{{ buku.id }}" class="btn btn-outline-secondary btn-sm">← Detail</a>
        <a href="/static/uploads/pdf/{{ buku.file_pdf }}" download class="btn btn-primary btn-sm">⬇️ Download PDF</a>
    </div>
</div>

<div class="card shadow-sm border-0 p-2 bg-light" style="border-radius: 12px;">
    <iframe src="/static/uploads/pdf/{{ buku.file_pdf }}" width="100%" height="750px"
        style="border: none; border-radius: 8px; background: #fff;">
    </iframe>
</div>
{% endblock %}
