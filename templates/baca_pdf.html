{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <h3 class="mb-0">{{ buku.judul }}</h3>
        <small class="text-muted">oleh {{ buku.penulis }}</small>
    </div>
    <div>
        <a href="/buku/{{ buku.id }}" class="btn btn-outline-secondary btn-sm">← Detail</a>
        <a href="/static/uploads/pdf/{{ buku.file_pdf }}" download class="btn btn-primary btn-sm">⬇️ Download PDF</a>
    </div>
</div>

<div style="border-radius: 10px; overflow: hidden; box-shadow: 0 4px 20px rgba(64, 224, 208, 0.3);">
    <iframe src="/static/uploads/pdf/{{ buku.file_pdf }}" width="100%" height="800px"
        style="border: none; background: #fff;">
    </iframe>
</div>
{% endblock %}
