{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3 class="mb-4">Tambah Buku Baru</h3>
        <form method="POST" enctype="multipart/form-data" autocomplete="off">
            <div class="mb-3">
                <label>Judul</label>
                <input type="text" name="judul" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Penulis</label>
                <input type="text" name="penulis" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Kategori</label>
                <input type="text" name="kategori" class="form-control">
            </div>
            <div class="mb-3">
                <label>Deskripsi</label>
                <textarea name="deskripsi" class="form-control" rows="3"></textarea>
            </div>
            <div class="mb-3">
                <label>Stok</label>
                <input type="number" name="stok" class="form-control" value="1" min="1" required>
            </div>
            <div class="mb-3">
                <label>File PDF Buku (opsional)</label>
                <input type="file" name="file_pdf" class="form-control" accept=".pdf">
                <small class="text-muted">Format: PDF. Maksimal 100 MB.</small>
            </div>
            <button type="submit" class="btn btn-success w-100">Simpan Buku</button>
        </form>
    </div>
</div>
{% endblock %}
