{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h3 class="mb-4">Ganti Password</h3>
        <form method="POST" autocomplete="off">
            <div class="mb-3">
                <label>Password Lama</label>
                <div class="input-group">
                    <input type="password" name="password_lama" id="pass1" class="form-control" required>
                    <button type="button" class="btn btn-outline-secondary"
                        onclick="togglePassword('pass1', this)">👁️</button>
                </div>
            </div>
            <div class="mb-3">
                <label>Password Baru</label>
                <div class="input-group">
                    <input type="password" name="password_baru" id="pass2" class="form-control" required minlength="4">
                    <button type="button" class="btn btn-outline-secondary"
                        onclick="togglePassword('pass2', this)">👁️</button>
                </div>
            </div>
            <div class="mb-3">
                <label>Konfirmasi Password Baru</label>
                <div class="input-group">
                    <input type="password" name="konfirmasi" id="pass3" class="form-control" required minlength="4">
                    <button type="button" class="btn btn-outline-secondary"
                        onclick="togglePassword('pass3', this)">👁️</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Simpan Password Baru</button>
        </form>
        <p class="mt-3 text-center"><a href="/dashboard">← Kembali ke Dashboard</a></p>
    </div>
</div>

<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            button.textContent = '🙈';
        } else {
            input.type = 'password';
            button.textContent = '👁️';
        }
    }
</script>
{% endblock %}
