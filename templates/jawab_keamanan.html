{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h3 class="mb-4">🔐 Reset Password</h3>
        <p class="text-muted">Halo <strong>{{ user.username }}</strong>, jawab pertanyaan keamanan untuk reset password.
        </p>

        <form method="POST" autocomplete="off">
            <div class="mb-3">
                <label>Pertanyaan Keamanan</label>
                <input type="text" class="form-control" value="{{ user.pertanyaan_keamanan }}" disabled>
            </div>
            <div class="mb-3">
                <label>Jawaban Kamu</label>
                <input type="text" name="jawaban" class="form-control" required>
            </div>
            <hr>
            <div class="mb-3">
                <label>Password Baru</label>
                <div class="input-group">
                    <input type="password" name="password_baru" id="pass1" class="form-control" required minlength="4">
                    <button type="button" class="btn btn-outline-secondary"
                        onclick="togglePassword('pass1', this)">👁️</button>
                </div>
            </div>
            <div class="mb-3">
                <label>Konfirmasi Password Baru</label>
                <div class="input-group">
                    <input type="password" name="konfirmasi" id="pass2" class="form-control" required minlength="4">
                    <button type="button" class="btn btn-outline-secondary"
                        onclick="togglePassword('pass2', this)">👁️</button>
                </div>
            </div>
            <button type="submit" class="btn btn-warning w-100">Reset Password</button>
        </form>
    </div>
</div>

<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            button.textContent = '🙈';
        } else {
            input.type = 'password';
            button.textContent = '👁️';
        }
    }
</script>
{% endblock %}
