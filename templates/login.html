{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4 shadow-sm border-0">
            <h3 class="mb-4 fw-bold text-center">Login</h3>

            <form method="POST" autocomplete="off">
                <div class="mb-3">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Password</label>
                    <div class="input-group">
                        <input type="password" name="password" id="passwordInput" class="form-control" required>
                        <button type="button" class="btn btn-outline-secondary"
                            onclick="togglePassword('passwordInput', this)">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-2">Login</button>
            </form>

            <div class="text-center mt-4">
                <p class="mb-1">Belum punya akun? <a href="/register" class="text-decoration-none fw-bold">Register</a>
                </p>
                <a href="/lupa-password" class="text-muted small text-decoration-none">Lupa password?</a>
            </div>
        </div>
    </div>
</div>

<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            button.textContent = '🙈';
        } else {
            input.type = 'password';
            button.textContent = '👁️';
        }
    }
</script>
{% endblock %}
