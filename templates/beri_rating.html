{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card p-4 shadow-sm border-0">
            <h3 class="mb-4 fw-bold text-center">Beri Rating</h3>
            <p class="text-center text-muted mb-4">Bagaimana pendapatmu tentang buku <br><strong class="text-dark">"{{
                    buku.judul }}"</strong>?</p>

            <form method="POST">
                <div class="mb-4">
                    <label class="mb-2">Bintang (1-5)</label>
                    <select name="bintang" class="form-select form-select-lg text-warning fw-bold">
                        <option value="5">⭐⭐⭐⭐⭐ (Sangat Bagus)</option>
                        <option value="4">⭐⭐⭐⭐ (Bagus)</option>
                        <option value="3">⭐⭐⭐ (Cukup)</option>
                        <option value="2">⭐⭐ (Kurang)</option>
                        <option value="1">⭐ (Buruk)</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label>Ulasan (opsional)</label>
                    <textarea name="ulasan" class="form-control" rows="4"
                        placeholder="Tulis kesanmu membaca buku ini..."></textarea>
                </div>
                <button type="submit" class="btn btn-warning text-dark w-100 py-2 fw-bold">Kirim Rating</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
