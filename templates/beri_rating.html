{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3 class="mb-4">Beri Rating untuk "{{ buku.judul }}"</h3>
        <form method="POST">
            <div class="mb-3">
                <label>Bintang (1-5)</label>
                <select name="bintang" class="form-select">
                    <option value="5">⭐⭐⭐⭐⭐ (5)</option>
                    <option value="4">⭐⭐⭐⭐ (4)</option>
                    <option value="3">⭐⭐⭐ (3)</option>
                    <option value="2">⭐⭐ (2)</option>
                    <option value="1">⭐ (1)</option>
                </select>
            </div>
            <div class="mb-3">
                <label>Ulasan (opsional)</label>
                <textarea name="ulasan" class="form-control" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-warning w-100">Kirim Rating</button>
        </form>
    </div>
</div>
{% endblock %}
