{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h3 class="mb-4">🔐 Lupa Password</h3>
        <p class="text-muted">Masukkan username kamu, nanti akan muncul pertanyaan keamanan.</p>
        <form method="POST" autocomplete="off">
            <div class="mb-3">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Lanjut</button>
        </form>
        <p class="mt-3 text-center"><a href="/login">← Kembali ke Login</a></p>
    </div>
</div>
{% endblock %}
