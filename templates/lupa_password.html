{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4 shadow-sm border-0">
            <h3 class="mb-3 fw-bold text-center">🔐 Lupa Password</h3>
            <p class="text-muted text-center mb-4">Masukkan username kamu, nanti akan muncul pertanyaan keamanan.</p>
            <form method="POST" autocomplete="off">
                <div class="mb-4">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Lanjut</button>
            </form>
            <div class="text-center mt-3">
                <a href="/login" class="text-muted text-decoration-none small">← Kembali ke Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
